<!-- MI BODA - SIN variables de color en el HTML -->
<div *ngIf="data" class="invitacion-container">
  <!-- Hero Section -->
  <app-hero-section
    *ngIf="data.heroImage"
    [nombres]="data.nombres || ''"
    [fecha]="fechaFormateada"
    [lugar]="data.lugar || ''"
    [heroImage]="data.heroImage"
    [fuente]="'Playfair Display, serif'"
    [colorTexto]="'#ffffff'"
  ></app-hero-section>

  <!-- Nos Casamos -->
  <app-nos-casamos-section
    *ngIf="data.frasePrincipal || data.mensajePrincipal"
    [frase]="data.frasePrincipal || ''"
    [mensaje]="data.mensajePrincipal || ''"
    [fontFamily]="'Playfair Display, serif'"
    [colorTexto]="'#5c3d2e'"
  ></app-nos-casamos-section>

  <!-- Historia -->
  <app-historia-section
    *ngIf="data.historia"
    [data]="data.historia"
  ></app-historia-section>

  <!-- Invitación Válida -->
  <app-invitacion-valida-section
    *ngIf="data"
    [invitado]="data.invitado ?? 'Invitado especial'"
    [pases]="data.pases ?? 1"
    [mensajePersonalizado]="data.mensajePersonalizado"
    [eventoData]="data"
  >
  </app-invitacion-valida-section>

  <!-- Ceremonia -->
  <app-ceremonia-section
    *ngIf="data.ceremonia"
    [data]="data.ceremonia"
  ></app-ceremonia-section>

  <!-- Recepción -->
  <app-recepcion-section
    *ngIf="data.recepcion"
    [data]="data.recepcion"
  ></app-recepcion-section>

  <!-- Padres -->
  <app-padres-section
    *ngIf="data.padres"
    [data]="data.padres"
  ></app-padres-section>

  <!-- Padrinos -->
  <app-padrinos-section
    *ngIf="data.padrinos"
    [data]="data.padrinos"
  ></app-padrinos-section>

  <!-- Damas -->
  <app-damas-section *ngIf="data.damas" [data]="data.damas"></app-damas-section>

  <!-- Dress Code -->
  <app-dresscode-section
    *ngIf="data.dressCode"
    [data]="data.dressCode"
  ></app-dresscode-section>

  <!-- Galería -->
  <app-galeria-section
    *ngIf="data.photos && data.photos.length > 0"
    [fotos]="data.photos"
  ></app-galeria-section>

  <!-- Itinerario -->
  <app-itinerario-section
    *ngIf="data.itinerario"
    [data]="data.itinerario"
  ></app-itinerario-section>

  <!-- Hospedaje -->
  <app-hospedaje-section
    *ngIf="data.hospedaje"
    [data]="data.hospedaje"
  ></app-hospedaje-section>

  <!-- Hashtag -->
  <app-hashtag-section
    *ngIf="data.hashtag"
    [data]="data.hashtag"
  ></app-hashtag-section>

  <!-- Contador -->
  <app-contador-section
    *ngIf="data.contador"
    [data]="data.contador"
  ></app-contador-section>

  <!-- Regalos -->
  <app-regalos-section
    *ngIf="data.regalos"
    [data]="data.regalos"
  ></app-regalos-section>

  <!-- Consideraciones -->
  <app-consideraciones-section
    *ngIf="data.consideraciones"
    [data]="data.consideraciones"
  ></app-consideraciones-section>

  <!-- Confirmación -->
  <app-confirmacion-section *ngIf="data" [eventoData]="data">
  </app-confirmacion-section>

  <app-footer-section></app-footer-section>
</div>

<div *ngIf="!data">Cargando invitación...</div>

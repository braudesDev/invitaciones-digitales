<div class="registro-container">
  <div class="registro-card">
    <div class="header">
      <span class="icon">👑</span>
      <h2>Registro de Anfitrión</h2>
      <p>Crea tu cuenta para empezar a usar el sistema</p>
    </div>

    <form (ngSubmit)="registrar()">
      <div class="form-group">
        <label>📧 Email</label>
        <input type="email" [(ngModel)]="email" name="email" required>
      </div>
      
      <div class="form-group">
        <label>🔒 Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" required>
      </div>
      
      <div class="form-group">
        <label>🔒 Confirmar Contraseña</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required>
      </div>
      
      <button type="submit" [disabled]="loading" class="btn-registro">
        {{ loading ? '⏳ Registrando...' : '✨ Registrarse como Anfitrión' }}
      </button>
      
      <div class="error" *ngIf="error">
        ❌ {{ error }}
      </div>
      
      <div class="success" *ngIf="success">
        ✅ {{ success }}
      </div>
    </form>
    
    <div class="login-link">
      ¿Ya tienes cuenta? <a routerLink="/anfitrion/login">Inicia sesión</a>
    </div>
  </div>
</div>

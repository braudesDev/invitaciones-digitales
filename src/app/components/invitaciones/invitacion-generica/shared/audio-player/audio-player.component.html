@if (audioConfig?.habilitado && audioConfig?.canciones?.length > 0) {
  <!-- ✅ AGREGAR [style] CON LOS COLORES DINÁMICOS -->
  <div
    class="audio-player"
    [class.visible]="visible"
    [style]="{
      '--primary-color': primaryColor,
      '--accent-color': accentColor,
      '--text-color': textColor,
      '--primary-rgb': primaryColor | hexToRgb,
      '--accent-rgb': accentColor | hexToRgb,
    }"
  >
    <button
      class="audio-btn"
      (click)="togglePlay()"
      [title]="isPlaying ? 'Pausar música' : 'Reproducir música'"
    >
      @if (isPlaying) {
        <ng-icon name="heroPause" size="24"></ng-icon>
      } @else {
        <ng-icon name="heroPlay" size="24"></ng-icon>
      }
    </button>

    <div class="audio-controls">
      <button
        class="audio-btn-small"
        (click)="toggleMute()"
        [title]="isMuted ? 'Activar sonido' : 'Silenciar'"
      >
        @if (isMuted) {
          <ng-icon name="heroSpeakerXMark" size="18"></ng-icon>
        } @else {
          <ng-icon name="heroSpeakerWave" size="18"></ng-icon>
        }
      </button>

      <input
        type="range"
        class="volume-slider"
        min="0"
        max="1"
        step="0.01"
        [value]="volumen"
        (input)="cambiarVolumen($event)"
      />
    </div>
  </div>
}

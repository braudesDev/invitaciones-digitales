<section
  class="hero-section"
  [style.backgroundImage]="'url(' + imagenSeleccionada + ')'"
>
  <div class="overlay">
    <div class="pattern-overlay"></div>
    <div class="gradient-overlay"></div>
  </div>

  <div class="hero-content">
    <h1
      class="hero-title"
      [ngClass]="animacion"
      [ngStyle]="{
        'font-family': fuente,
        color: colorTexto,
      }"
    >
      {{ nombres }}
    </h1>

    <!--  DIVISOR CON CORAZÓN (reemplaza ◆) -->
    <div class="hero-divider">
      <span class="divider-line"></span>
      <ng-icon name="heroHeart" size="20" class="divider-icon"></ng-icon>
      <span class="divider-line"></span>
    </div>

    <!-- FECHA CON CALENDARIO -->
    <p class="hero-date" [style.color]="colorTexto">
      <ng-icon name="heroCalendar" size="18" class="inline-icon"></ng-icon>
      <span class="date-day">{{ fechaFormateadaObj.dia }}</span>
      <span class="date-month">{{ fechaFormateadaObj.mes }}</span>
      <span class="date-year">{{ fechaFormateadaObj.anio }}</span>
    </p>

    <!--  LUGAR CON MAP PIN -->
    <p class="hero-location" [style.color]="colorTexto">
      <ng-icon name="heroMapPin" size="18" class="inline-icon"></ng-icon>
      {{ lugar }}
    </p>

    <!--  SCROLL CON FLECHA (reemplaza el SVG manual) -->
    <div class="hero-scroll" (click)="scrollToNextSection()">
      <span class="scroll-text">Descubre más</span>
      <ng-icon name="heroArrowDown" size="28" class="scroll-arrow"></ng-icon>
    </div>
  </div>

  <div class="hero-glow"></div>
</section>

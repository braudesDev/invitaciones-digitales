<section class="nos-casamos-section">
  <div class="overlay"></div>

  <div class="contenido">
    <div class="icono-decorativo">💕</div>
    <h2 class="section-title">{{ frase }}</h2>

    <div class="decorative-line">
      <span class="line-left"></span>
      <span class="line-center">✦</span>
      <span class="line-right"></span>
    </div>

    <p class="section-text">{{ mensaje }}</p>

    <!-- Elementos flotantes decorativos -->
    <div class="floating-elements">
      <span class="flor flor-1">🌸</span>
      <span class="flor flor-2">🌿</span>
      <span class="flor flor-3">🌺</span>
    </div>
  </div>
</section>

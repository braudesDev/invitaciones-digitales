<div
  *ngIf="data && (data.lugar || data.direccion || data.hora)"
  class="recepcion-section"
>
  <div class="section-icon">🎉</div>
  <h3>Recepción</h3>
  <div class="info-card">
    <div class="info-item" *ngIf="data.lugar">
      <span class="info-label">📍 Lugar</span>
      <p class="info-value">{{ data.lugar }}</p>
    </div>
    <div class="info-item" *ngIf="data.direccion">
      <span class="info-label">📌 Dirección</span>
      <p class="info-value">{{ data.direccion }}</p>
    </div>
    <div class="info-item" *ngIf="data.hora">
      <span class="info-label">⏰ Hora</span>
      <p class="info-value">{{ data.hora }}</p>
    </div>
  </div>
</div>

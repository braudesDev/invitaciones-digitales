<div class="image-upload-container">
  <label class="upload-label">{{ label }}</label>

  <div class="upload-area">
    <label class="btn-upload" [class.cargando]="imagenSubiendo">
      📁 {{ imagenSubiendo ? "Subiendo..." : "Seleccionar imagen" }}
      <input
        type="file"
        (change)="subirImagen($event)"
        accept="image/*"
        [disabled]="imagenSubiendo"
      />
    </label>
    <span class="upload-info">PNG, JPG, WEBP (máx. 5MB)</span>
  </div>

  @if (imageUrl) {
    <div class="preview-img">
      <img [src]="imageUrl" alt="Preview" />
      <button class="btn-cambiar-img" (click)="limpiarImagen()" type="button">
        🔄 Cambiar imagen
      </button>
    </div>
  }
</div>
